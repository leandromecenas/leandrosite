name: Locate gestor button

on:
  push:
    paths:
      - '.github/workflows/update-gestor-link.yml'

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate gestor markup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('link-na-bio.html').read_text(encoding='utf-8')
          for term in ['gestor', 'Gestor', 'GESTOR', 'tráfego', 'trafego', 'TRÁFEGO']:
              print(f'--- TERM {term!r} ---')
              found = False
              for i, m in enumerate(re.finditer(re.escape(term), text, re.I)):
                  found = True
                  a = max(0, m.start()-700)
                  b = min(len(text), m.end()+700)
                  snippet = text[a:b].replace('\n', ' ')
                  print(f'Occurrence {i+1} at {m.start()}: {snippet}')
                  if i >= 9:
                      break
              if not found:
                  print('NONE')
          PY
