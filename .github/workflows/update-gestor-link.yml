name: Inspect trafego card

on:
  push:
    paths:
      - '.github/workflows/update-gestor-link.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect card wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('link-na-bio.html').read_text(encoding='utf-8')
          needle = 'Tráfego para imóveis'
          pos = text.find(needle)
          print('POSITION', pos)
          if pos < 0:
              raise SystemExit('Texto não encontrado')
          print(text[max(0,pos-3000):min(len(text),pos+1600)].replace('\n',' '))
          PY
