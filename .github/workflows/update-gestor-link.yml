name: Apply gestor link

on:
  push:
    paths:
      - '.github/workflows/update-gestor-link.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update FLUXO card destination
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('link-na-bio.html')
          text = path.read_text(encoding='utf-8')
          old = 'href=\\"#formulario-fluxo\\"'
          new = 'href=\\"https://nivvo.online/f/linkbio\\" target=\\"_blank\\" rel=\\"noopener\\"'
          count = text.count(old)
          print('Matches found:', count)
          if count != 1:
              raise SystemExit(f'Esperava 1 ocorrência exata, encontrei {count}. Nenhuma alteração aplicada.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          print('FLUXO card updated to https://nivvo.online/f/linkbio')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add link-na-bio.html
          git diff --cached --quiet && exit 0
          git commit -m "Link FLUXO card to gestor form"
          git push
