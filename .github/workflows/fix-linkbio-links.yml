name: Apply link-in-bio destinations

on:
  push:
    paths:
      - '.github/workflows/fix-linkbio-links.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update destinations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('link-na-bio.html')
          text = path.read_text(encoding='utf-8')

          changes = [
              (
                  'href=\\\"https://nivvo.online/f/linkbio\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"',
                  'href=\\\"https://nivvo.online/f/linkbio\\\"',
                  'FLUXO CTA'
              ),
              (
                  'href=\\\"https://www.instagram.com\\\" target=\\\"_blank\\\" rel=\\\"noopener\\\"',
                  'href=\\\"https://www.instagram.com/leandromecenas/\\\"',
                  'Instagram'
              ),
          ]

          for old, new, label in changes:
              count = text.count(old)
              print(f'{label}: {count} exact match(es)')
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}; nothing written.')

          for old, new, label in changes:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('Both destinations updated; no target=_blank remains on these two links.')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add link-na-bio.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix CTA and Instagram navigation"
          git push origin HEAD:main
